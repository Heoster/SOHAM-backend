services:
  - type: web
    name: soham-backend-server
    region: oregon
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SOHAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_FREE_PLAN_ONLY
        value: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_AI_API_TOKEN
        sync: false
      - key: CLOUDFLARE_AI_GATEWAY_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: UPSTASH_VECTOR_REST_URL
        sync: false
      - key: UPSTASH_VECTOR_REST_TOKEN
        sync: false
      - key: YOU_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: PERCHANCE_SERVICE_HOSTPORT
        fromService:
          type: web
          name: soham-perchance
          property: hostport
      - key: PERCHANCE_SERVICE_TOKEN
        fromService:
          type: web
          name: soham-perchance
          envVarKey: PERCHANCE_SERVICE_TOKEN
      - key: CRICAPI_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false

  - type: web
    name: soham-perchance
    region: oregon
    runtime: docker
    plan: free
    dockerfilePath: ./perchance-service/Dockerfile
    dockerContext: ./perchance-service
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: PERCHANCE_SERVICE_TOKEN
        generateValue: true
