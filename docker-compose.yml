# Local production-like run: `docker compose up --build`
#
# Notes:
#  • The distributed rate limiter uses Upstash's REST API, not the Redis
#    wire protocol — a plain local `redis` container will NOT back it.
#    Without UPSTASH_REDIS_REST_URL/TOKEN the limiter automatically uses the
#    per-process in-memory backend (fine for a single local instance).
#  • No secrets are baked into the image; everything comes from `.env`.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
